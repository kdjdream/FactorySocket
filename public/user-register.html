<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>KIMS FACTORIES V1.0</title>
    <link rel="stylesheet" href="style.css?v=20261019-field-validation">
    <link rel="stylesheet" href="/registration.css?v=20261019-org-spacing">
    <script src="/page-settings.js?v=20261005-4" defer></script>
    <script src="/field-validation.js?v=1" defer></script>
    <script src="/user-register.js?v=20261025-five-level-job" defer></script>
</head>

<body class="auth-body auth-wide">
    <header>
        <div class="user-heading">
            <p class="user-eyebrow"></p>
            <h1>회원가입 신청</h1>
        </div>
    </header>
    <main class="auth-container wide">
        <section class="auth-card">
            <p class="help-text">가입 후 마스터 관리자의 승인까지 기다려 주세요. 승인 전에도 로그인하여 회원정보를 수정할 수 있습니다.</p>
            <form id="registerForm" class="form-grid" novalidate>
                <div><label>이름</label><input id="name" maxlength="100"></div>
                <div><label>아이디 *</label><input id="username" autocomplete="username" pattern="[A-Za-z0-9_]{4,50}"
                        required maxlength="50"><small>영문, 숫자, _ / 4~50자</small></div>
                <div><label>비밀번호 *</label><input id="password" type="password" autocomplete="new-password" minlength="4"
                        maxlength="100" required><small>4자 이상</small></div>
                <div><label>비밀번호 확인 *</label><input id="passwordConfirm" type="password" autocomplete="new-password"
                        minlength="4" maxlength="100" required></div>
                <fieldset class="registration-organization-fields full">
                    <legend>회사 조직</legend>
                    <small>조직 코드는 해당 조직의 관리자에게 문의하여 확인하시기 바랍니다.</small>
                    <small>일반 개인 사용자는 그룹·회사·사업장 코드가 001로 고정되고 부서·직무 코드는 가입자별로 자동 생성됩니다. 그 외 사용자는 해당 조직의 5단계 코드를 입력합니다.</small>
                    <label class="registration-default-choice"><input id="organizationUnknown" type="checkbox" checked>일반 개인 사용자 (Default)</label>
                    <div class="registration-code-grid">
                        <label>그룹<input id="organizationGroup" minlength="3" maxlength="3" autocomplete="off" value="001" disabled></label>
                        <label>회사<input id="organizationCompany" minlength="3" maxlength="3" autocomplete="off" value="001" disabled></label>
                        <label>사업장<input id="organizationSite" minlength="3" maxlength="3" autocomplete="off" value="001" disabled></label>
                        <label>부서<input id="organizationDepartment" minlength="3" maxlength="3" autocomplete="off" disabled></label>
                        <label>직무<input id="organizationRole" minlength="3" maxlength="3" autocomplete="off" disabled></label>
                    </div>
                    <div class="registration-organization-actions"><button id="organizationCheck" type="button">조직 확인</button><span id="organizationMessage" role="status" aria-live="polite"></span></div>
                    <p id="organizationDetails" class="registration-organization-details" hidden></p>
                </fieldset>
                <div><label>전화번호</label><input id="phone" type="tel" inputmode="tel" placeholder="010-1234-5678"
                    pattern="01[0-9]-?[0-9]{3,4}-?[0-9]{4}"></div>
                <div class="full"><label for="address">주소</label><input id="address" maxlength="255" autocomplete="street-address"></div>
                <div class="full"><label for="email">이메일</label><input id="email" type="email" autocomplete="email"
                    placeholder="user@example.com" maxlength="254"></div>
                <div class="full"><label for="registerComment">가입 신청 이유 *</label><textarea id="registerComment" maxlength="2000" rows="4" required></textarea></div>
                <div class="full registration-submit-row"><button id="registerSubmit" class="auth-button" type="submit" disabled>가입 신청</button><span id="message" class="auth-message" role="status" aria-live="polite"></span></div>
            </form>
            <div class="auth-links"><span>이미 회원이신가요?</span><a href="/user-login.html"> 로그인 </a></div>
        </section>
    </main>
</body>


</html>
