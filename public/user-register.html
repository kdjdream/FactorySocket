<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>KIMS FACTORIES V1.0</title>
    <link rel="stylesheet" href="style.css?v=20261005-2">
    <script src="/page-settings.js?v=20261005-4" defer></script>
</head>

<body class="auth-body auth-wide">
    <header>
        <div class="user-heading">
            <p class="user-eyebrow"></p>
            <h1>회원가입 신청</h1>
        </div>
    </header>
    <main class="auth-container wide">
        <section class="auth-card">
            <p class="help-text">가입 후 마스터 관리자의 승인까지 기다려 주세요. 승인 전에도 로그인하여 회원정보를 수정할 수 있습니다.</p>
            <form id="registerForm" class="form-grid">
                <div><label>이름</label><input id="name" maxlength="100"></div>
                <div><label>아이디 *</label><input id="username" autocomplete="username" pattern="[A-Za-z0-9_]{4,50}"
                        required maxlength="50"><small>영문, 숫자, _ / 4~50자</small></div>
                <div><label>비밀번호 *</label><input id="password" type="password" autocomplete="new-password" minlength="4"
                        maxlength="100" required><small>4자 이상</small></div>
                <div><label>비밀번호 확인 *</label><input id="passwordConfirm" type="password" autocomplete="new-password"
                        minlength="4" maxlength="100" required></div>
                <div><label>지역</label><input id="region" placeholder="예: 전북 군산" maxlength="100"></div>
                <div><label>회사</label><input id="company" maxlength="150"></div>
                <div><label>직위</label><input id="position" placeholder="예: 과장, 대표" maxlength="100"></div>
                <div><label>전화번호</label><input id="phone" type="tel" inputmode="tel" placeholder="010-1234-5678"
                    pattern="01[0-9]-?[0-9]{3,4}-?[0-9]{4}"></div>
                <div class="full"><label>이메일 주소</label><input id="email" type="email" autocomplete="email"
                    placeholder="user@example.com" maxlength="254"></div>
                <div class="full"><button class="auth-button" type="submit">가입 신청</button></div>
            </form>
            <!-- <p id="message" class="auth-message"><span>회원번호: ${data.userId}</span></p> -->
            <p id="message" class="auth-message"></p>
            <div class="auth-links"><span>이미 회원이신가요?</span><a href="/user-login.html"> 로그인 </a></div>
        </section>
    </main>
    <script src="/user-register.js?v=20261005-2"></script>
</body>


</html>
