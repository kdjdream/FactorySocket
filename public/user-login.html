<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>KIMS FACTORIES V1.0</title>
    <link rel="stylesheet" href="style.css?v=20261005-2">
    <script src="/page-settings.js?v=20261005-4" defer></script>
</head>

<body class="auth-body">
    <header>
        <div class="user-heading"><p class="user-eyebrow"></p><h1>회원 로그인</h1></div>
    </header>
    <main class="auth-container">
        <section class="auth-card">
            <form id="loginForm" autocomplete="off"><label>아이디</label><input id="username" autocomplete="off" required
                    maxlength="50"><label>비밀번호</label><input id="password" type="password" autocomplete="off" required
                    maxlength="100"><button class="auth-button" type="submit">로그인</button></form>
            <p id="message" class="auth-message"></p>
            <div class="auth-links"><a href="/user-register.html">회원가입 신청</a></div>
        </section>
    </main>
    <script src="/user-login.js"></script>
</body>

</html>
