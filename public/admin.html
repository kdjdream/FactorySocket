<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>회원가입 신청 승인</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div><h1>회원가입 신청 승인</h1><p>마스터 관리자 전용</p></div>
    <div class="header-actions"><a class="link" href="/">현황판</a><button class="logout-button" onclick="logout()">로그아웃</button></div>
  </header>
  <main>
    <section class="summary">
      <div class="card"><span>정식회원</span><strong id="total">0</strong></div>
      <div class="card"><span>승인 대기</span><strong id="pending">0</strong></div>
      <div class="card"><span>승인 회원</span><strong id="approved">0</strong></div>
      <div class="card"><span>기타</span><strong id="other">0</strong></div>
    </section>
    <section class="panel">
      <div class="panel-title"><div><h2>승인 신청 대기자 <span id="applicationStatusCounts" class="help-text"></span></h2><p class="help-text">대기 또는 반려 상태의 신청자를 확인한 후 승인·반려·수정·삭제할 수 있습니다.</p></div><button onclick="loadUsers()">새로고침</button></div>
      <div class="table-wrap"><table class="admin-table pending-member-table"><thead><tr><th>ID</th><th>아이디</th><th>이름</th><th>지역</th><th>회사</th><th>직위</th><th>전화</th><th>이메일</th><th>상태</th><th>가입일</th><th>최종 요청일</th><th>관리</th></tr></thead><tbody id="pendingTable"></tbody></table></div>
      <p id="emptyPending" class="help-text hidden">현재 승인 대기 중인 가입 신청자가 없습니다.</p>
    </section>
    <section class="panel">
      <div class="panel-title"><div><h2>회원 리스트 <span id="statusCounts" class="help-text"></span></h2><p class="help-text">users 테이블의 모든 회원이 표시됩니다.</p></div></div>
      <div class="table-wrap"><table class="admin-table member-table"><thead><tr><th>ID</th><th>아이디</th><th>이름</th><th>권한등급</th><th>상태</th><th>가입일</th><th>최종 변경일</th><th>관리</th></tr></thead><tbody id="userTable"></tbody></table></div>
      <p id="emptyApproved" class="help-text hidden">회원이 없습니다.</p>
    </section>
    <section id="editPanel" class="panel hidden">
      <h2>회원정보 수정</h2>
      <form id="editForm" class="form-grid admin-edit-form">
        <input id="editId" type="hidden">
        <div class="field"><label for="editUsername">아이디 *</label><input id="editUsername" required maxlength="50"></div>
        <div class="field"><label for="editName">이름 *</label><input id="editName" required maxlength="100"></div>
        <div class="field"><label for="editRegion">지역 *</label><input id="editRegion" required maxlength="100"></div>
        <div class="field"><label for="editCompany">회사 *</label><input id="editCompany" required maxlength="150"></div>
        <div class="field"><label for="editPosition">직위 *</label><input id="editPosition" required maxlength="100"></div>
        <div class="field"><label for="editPhone">전화번호 *</label><input id="editPhone" required></div>
        <div class="field"><label for="editEmail">이메일 *</label><input id="editEmail" type="email" required></div>
        <div class="field"><label for="editPermissionLevel">권한등급 *</label><select id="editPermissionLevel" required></select></div>
        <div class="field full"><label for="editAdminMemo">관리자 메모</label><textarea id="editAdminMemo" maxlength="5000" rows="4" placeholder="회원 관리에 필요한 메모를 입력하세요."></textarea><small>회원에게는 표시되지 않습니다.</small></div>
        <div class="field"><label for="editPassword">새 비밀번호</label><input id="editPassword" type="password" minlength="8"><small>변경하지 않으려면 비워두세요.</small></div>
        <div class="full edit-actions"><button class="auth-button" type="submit">저장</button><button class="auth-button secondary-button" type="button" onclick="closeEdit()">취소</button></div>
      </form>
      <p id="editMessage" class="auth-message"></p>
    </section>
  </main>
  <script>
    let users = [];
    let currentAdminLevel = 8;
    const table = document.getElementById('userTable');
    const pendingTable = document.getElementById('pendingTable');

    async function loadUsers() {
      const res = await fetch('/api/admin/users');
      if (res.status === 401) { location.href = '/login.html'; return; }
      if (res.status === 403) { alert('마스터 권한이 필요합니다.'); location.href = '/'; return; }
      users = await res.json();
      const me = await fetch('/api/me');
      if (me.ok) {
        const meData = await me.json();
        currentAdminLevel = Number(meData.user.permission_level || meData.user.permissionLevel || 8);
      }
      const pendingUsers = users.filter(user => ['PENDING', 'REJECTED', 'WITHDRAWAL_PENDING'].includes(user.status));
      const approvedUsers = users.filter(user => ['APPROVED', 'SUSPENDED'].includes(user.status));
      const otherUsers = users.filter(user => !['PENDING', 'APPROVED', 'SUSPENDED'].includes(user.status));
      document.getElementById('total').textContent = users.length;
      document.getElementById('pending').textContent = pendingUsers.length;
      document.getElementById('approved').textContent = approvedUsers.length;
      document.getElementById('other').textContent = otherUsers.length;
      document.getElementById('statusCounts').textContent = `대기 ${users.filter(user => user.status === 'PENDING').length}명 · 승인 ${users.filter(user => user.status === 'APPROVED').length}명 · 정지 ${users.filter(user => user.status === 'SUSPENDED').length}명 · 반려 ${users.filter(user => user.status === 'REJECTED').length}명 · 탈퇴신청 ${users.filter(user => user.status === 'WITHDRAWAL_PENDING').length}명`;
      document.getElementById('applicationStatusCounts').textContent = `승인대기 ${users.filter(user => user.status === 'PENDING').length}명 · 반려 ${users.filter(user => user.status === 'REJECTED').length}명 · 탈퇴신청 ${users.filter(user => user.status === 'WITHDRAWAL_PENDING').length}명`;
      document.getElementById('emptyPending').classList.toggle('hidden', pendingUsers.length > 0);
      document.getElementById('emptyApproved').classList.toggle('hidden', users.length > 0);
      pendingTable.innerHTML = pendingUsers.map(user => `<tr><td>${user.id}</td><td>${h(user.username)}</td><td>${h(user.name)}</td><td>${h(user.region)}</td><td>${h(user.company)}</td><td>${h(user.position)}</td><td>${h(user.phone)}</td><td>${h(user.email)}</td><td><span class="status ${user.status === 'PENDING' ? 'waiting' : 'stop'}">${statusText(user.status)}</span></td><td>${h(user.created_at || '-')}</td><td>${h(user.user_request_at || user.created_at || '-')}</td><td class="admin-actions">${user.status === 'WITHDRAWAL_PENDING' ? `<button onclick="changeStatus(${user.id}, 'APPROVED')">탈퇴 반려</button><button onclick="deleteUser(${user.id})">탈퇴 승인</button>` : `<button onclick="changeStatus(${user.id}, 'APPROVED')">승인</button><button onclick="changeStatus(${user.id}, 'REJECTED')">반려</button>`}<button onclick="openEdit(${user.id})">수정</button><button onclick="deleteUser(${user.id})">삭제</button></td></tr>`).join('');
      table.innerHTML = users.map(user => `<tr><td>${user.id}</td><td>${h(user.username)}</td><td>${h(user.name)}</td><td>${Number(user.permission_level || 1)}등급</td><td><span class="status ${user.status === 'APPROVED' ? 'done' : user.status === 'PENDING' ? 'waiting' : 'stop'}">${statusText(user.status)}</span></td><td>${h(user.created_at || '-')}</td><td>${h(user.updated_at || '-')}</td><td class="admin-actions">${user.status === 'PENDING' ? `<button onclick="changeStatus(${user.id}, 'APPROVED')">승인</button><button onclick="changeStatus(${user.id}, 'REJECTED')">반려</button>` : ''}${user.status === 'WITHDRAWAL_PENDING' ? `<button onclick="changeStatus(${user.id}, 'APPROVED')">탈퇴 반려</button><button onclick="deleteUser(${user.id})">탈퇴 승인</button>` : ''}${['APPROVED', 'SUSPENDED'].includes(user.status) && Number(user.permission_level || 1) < currentAdminLevel ? `<button onclick="changeStatus(${user.id}, '${user.status === 'SUSPENDED' ? 'APPROVED' : 'SUSPENDED'}')">${user.status === 'SUSPENDED' ? '재승인' : '정지'}</button>` : ''}${Number(user.permission_level || 1) < currentAdminLevel ? `<button onclick="deleteUser(${user.id})">삭제</button>` : ''}<button onclick="openEdit(${user.id})">수정</button></td></tr>`).join('');
    }

    function statusText(status) { return { PENDING: '승인대기', APPROVED: '승인', REJECTED: '반려', SUSPENDED: '정지', WITHDRAWAL_PENDING: '탈퇴신청' }[status] || status; }

    function h(value) { return String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;'); }

    async function changeStatus(id, status) {
      if (status === 'REJECTED' && !confirm('이 가입 신청을 반려하시겠습니까?')) return;
      const res = await fetch(`/api/admin/users/${id}/status`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status }) });
      const data = await res.json();
      if (!res.ok) { alert(data.error || '처리 실패'); return; }
      await loadUsers();
    }

    async function deleteUser(id) {
      if (!confirm('이 회원을 삭제하시겠습니까? 삭제 후 복구할 수 없습니다.')) return;
      const res = await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) { alert(data.error || '삭제 실패'); return; }
      await loadUsers();
    }

    function openEdit(id) {
      const user = users.find(item => item.id === id);
      if (!user) return;
      document.getElementById('editPanel').classList.remove('hidden');
      [['editId', 'id'], ['editUsername', 'username'], ['editName', 'name'], ['editRegion', 'region'], ['editCompany', 'company'], ['editPosition', 'position'], ['editPhone', 'phone'], ['editEmail', 'email']].forEach(([field, key]) => { document.getElementById(field).value = user[key] || ''; });
      document.getElementById('editAdminMemo').value = user.admin_memo || '';
      document.getElementById('editPermissionLevel').innerHTML = Array.from({ length: Math.max(0, currentAdminLevel - 1) }, (_, index) => index + 1).map(level => `<option value="${level}">${level}등급</option>`).join('');
      document.getElementById('editPermissionLevel').value = user.permission_level || 1;
      document.getElementById('editPassword').value = '';
      scrollTo({ top: document.getElementById('editPanel').offsetTop, behavior: 'smooth' });
    }

    function closeEdit() { document.getElementById('editPanel').classList.add('hidden'); }
    document.getElementById('editForm').addEventListener('submit', async event => {
      event.preventDefault();
      const id = document.getElementById('editId').value;
      const body = { username: editUsername.value, name: editName.value, region: editRegion.value, company: editCompany.value, position: editPosition.value, phone: editPhone.value, email: editEmail.value, permissionLevel: editPermissionLevel.value, adminMemo: editAdminMemo.value, password: editPassword.value };
      const res = await fetch(`/api/admin/users/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      const message = document.getElementById('editMessage');
      if (!res.ok) { message.textContent = data.error || '수정 실패'; message.className = 'auth-message error'; return; }
      message.textContent = data.message; message.className = 'auth-message success';
      setTimeout(() => { closeEdit(); loadUsers(); }, 700);
    });
    async function logout() { document.getElementById('editPassword').value = ''; await fetch('/api/logout', { method: 'POST' }); location.href = '/login.html?logged_out=1'; }
    loadUsers();
  </script>
</body>
</html>
