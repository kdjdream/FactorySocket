<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIMS FACTORIES V1.0</title>
  <link rel="stylesheet" href="style.css?v=20261015-product-control-button-style">
  <link rel="stylesheet" href="/product-quantity.css?v=3">
  <script src="/page-settings.js?v=20261016-product-admin7" defer></script>
</head>

<body class="product-quantity-page">
  <header>
    <div class="product-heading">
      <p class="product-eyebrow"></p>
      <h1>생산 입력</h1>
    </div>

    <div class="header-actions">
      <span id="userInfo" class="user-info">로그인 확인 중...</span>
      <a class="link" href="/">생산 현황</a>
      <a id="productChannelLink" class="link" href="/product-channel-link.html" style="display:none">제품-채널 연결</a>
      <a id="productAdminLink" class="link" href="/product-admin.html" style="display:none">제품 관리</a>
      <a class="link" href="/product-report.html">생산 리포트</a>
      <a class="link" href="/device-view.html">Device 보기</a>
      <a class="link" href="/device-control.html">Device 제어</a>
      <a id="profileLink" class="link" href="/user-profile.html">회원정보</a>
      <button class="logout-button" onclick="logout()">로그아웃</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-title product-selection-heading">
        <h2>작업 수량 입력</h2>
        <span>입력한 수량이 작업수량과 누적 수량에 더해집니다.</span>
        <div class="product-selection-toolbar" role="group" aria-label="생산 입력 제품 선택">
          <span id="productSelectionCount" aria-live="polite"></span>
          <button id="productSelectButton" class="link" type="button">제품 선택</button>
        </div>
      </div>
      <div id="controls" class="control-grid"></div>
    </section>
  </main>

  <dialog id="productPicker" class="product-picker" aria-labelledby="productPickerTitle">
    <form id="productPickerForm">
      <h2 id="productPickerTitle">생산 입력할 제품 선택</h2>
      <label class="product-picker-option product-picker-select-all">
        <input id="productSelectAll" type="checkbox">
        <span>전체 선택</span>
      </label>
      <div id="productPickerChoices" class="product-picker-choices"></div>
      <p id="productPickerEmpty" class="product-picker-empty" hidden>활성화된 제품이 없습니다.</p>
      <p id="productPickerMessage" role="status" aria-live="polite"></p>
      <div class="product-picker-footer">
        <button id="productPickerCancel" type="button">취소</button>
        <button class="admin-submit" type="submit">적용</button>
      </div>
    </form>
  </dialog>

  <script src="/product-selection.js?v=20261024-database"></script>
  <script src="/product-control.js?v=20261024-selection-database"></script>
</body>

</html>
