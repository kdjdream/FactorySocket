<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KIMS FACTORIES V1.0</title>
  <link rel="stylesheet" href="/style.css?v=20261018-level-policy">
  <link rel="stylesheet" href="/user-level.css?v=1">
  <script src="/page-settings.js?v=20261018-level-policy" defer></script>
  <script src="/user-logout.js" defer></script>
  <script src="/user-level.js?v=20261018-db-defaults" defer></script>
</head>
<body class="level-policy-page">
  <header>
    <div class="user-heading"><p class="user-eyebrow"></p><h1>레벨 권한</h1></div>
    <nav class="header-actions" aria-label="회원 페이지">
      <a class="link" href="/">생산 현황</a>
      <a class="link" href="/user-profile.html">회원 정보</a>
      <button class="logout-button" onclick="logout()">로그아웃</button>
    </nav>
  </header>
  <main>
    <section class="level-policy-section" aria-labelledby="levelPolicyTitle">
      <div class="level-policy-toolbar">
        <div><h2 id="levelPolicyTitle">업무별 접근 레벨</h2><span id="levelPolicyVersion">레벨 1~20</span></div>
        <div class="level-policy-actions">
          <span id="levelPolicyDirty" role="status"></span>
          <button id="levelPolicyReload" type="button">다시 불러오기</button>
          <button id="levelPolicyDefaults" type="button" disabled>기본값</button>
          <button id="levelPolicySave" class="admin-submit" type="button" disabled>저장</button>
        </div>
      </div>
      <p id="levelPolicyMessage" class="level-policy-message" role="status" aria-live="polite"></p>
      <div class="table-wrap level-policy-wrap">
        <table class="level-policy-table">
          <thead><tr><th scope="col">업무</th><th scope="col"><div class="level-policy-axis" aria-label="회원 레벨 1부터 20"></div></th><th scope="col">User-level</th></tr></thead>
          <tbody id="levelPolicyRows"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
