<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>KIMS FACTORIES V1.0</title>
  <link rel="stylesheet" href="style.css?v=20261015-product-admin-button-style">
  <link rel="stylesheet" href="/product-quantity.css?v=20261018-column-filters">
  <script src="/page-settings.js?v=20261016-product-admin7" defer></script>
</head>

<body class="product-quantity-page product-admin-page">
  <header>
    <div class="product-heading">
      <p class="product-eyebrow"></p>
      <h1>제품 관리</h1>
    </div>
    <div class="header-actions"><a class="link" href="/">생산 현황</a>
      <a class="link" href="/product-control.html">생산 입력</a>
      <a class="link" href="/product-report.html">생산 리포트</a>
      <a class="link" href="/device-view.html">Device 보기</a>
      <a id="profileLink" class="link" href="/user-profile.html">회원정보</a>
      <button class="logout-button" onclick="logout()">로그아웃</button>
    </div>
  </header>
  <main>
    <section class="panel">
      <div class="panel-title">
        <div>
          <h2 id="addFormTitle">새로운 제품코드 추가</h2>
          <p id="addFormHelp" class="help-text">제품코드, 제품명, 목표수량을 입력하세요.</p>
        </div>
      </div>
      <form id="addForm" class="form-grid product-add-form">
        <div><label>제품코드 *</label><input id="newCode" maxlength="50" required
            style="padding: 13px 12px; font-size: 16px;"></div>
        <div><label>제품명 *</label><input id="newName" maxlength="100" required
            style="padding: 13px 12px; font-size: 16px;"></div>
        <div><label for="newQuantity">누적 수량 *</label><input id="newQuantity" type="number" min="0" max="2147483647" step="1" value="0" required
          style="padding: 13px 12px; font-size: 16px;"></div>
        <div><label for="newWorkQuantity">작업 수량 *</label><input id="newWorkQuantity" type="number" min="0" max="2147483647" step="1" value="0" required
            style="padding: 13px 12px; font-size: 16px;"></div>
        <div><label>목표수량 *</label><input id="newTarget" type="number" min="0" step="1" required
            style="padding: 13px 12px; font-size: 16px;"></div>
        <div><label>상태 *</label><select id="newStatus" required style="padding: 13px 12px; font-size: 16px;">
            <option value="대기">대기</option>
            <option value="생산중">생산중</option>
            <option value="수리중">수리중</option>
            <option value="완료">완료</option>
            <option value="정지">정지</option>
          </select></div>
        <div class="full">
          <label for="newReason">등록 / 수정 사유 *</label>
          <input id="newReason" type="text" maxlength="500" required>
        </div>
        <div class="full">
          <button id="addFormSubmit" class="output-button admin-submit admin-form-action-button" type="submit">제품 추가 등록</button>
          <button id="cancelProductEdit" class="output-button admin-submit admin-form-action-button" type="button" hidden>수정 취소</button>
        </div>
      </form>
      <p id="addMessage" class="auth-message"></p>
    </section>
    <section class="panel">
      <div class="panel-title">
        <div>
          <h2>제품 목록 수정</h2>
          <p class="help-text">제품을 수정·삭제하고, 사용 여부를 설정하거나 행을 드래그해 순서를 변경할 수 있습니다.</p>
        </div><button class="output-button admin-submit admin-form-action-button" onclick="loadProducts()">새로고침</button>
      </div>
      <div class="table-wrap">
        <table class="admin-table product-edit-table product-admin-list">
          <thead>
            <tr>
              <th><div class="product-column-heading"><span>순위</span><div class="product-column-filter" data-product-filter-container="rank"></div></div></th>
              <th><div class="product-column-heading"><span>ID</span><div class="product-column-filter" data-product-filter-container="id"></div></div></th>
              <th><div class="product-column-heading"><span>제품코드</span><div class="product-column-filter" data-product-filter-container="product_code"></div></div></th>
              <th><div class="product-column-heading"><span>제품명</span><div class="product-column-filter" data-product-filter-container="product_name"></div></div></th>
              <th><div class="product-column-heading"><span>누적 수량</span><div class="product-column-filter" data-product-filter-container="quantity"></div></div></th>
              <th><div class="product-column-heading"><span>작업 수량</span><div class="product-column-filter" data-product-filter-container="work_quantity"></div></div></th>
              <th><div class="product-column-heading"><span>목표수량</span><div class="product-column-filter" data-product-filter-container="target_quantity"></div></div></th>
              <th><div class="product-column-heading"><span>상태</span><div class="product-column-filter" data-product-filter-container="status"></div></div></th>
              <th><div class="product-column-heading"><span>사용</span><div class="product-column-filter" data-product-filter-container="is_enabled"></div></div></th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody id="productTable"></tbody>
        </table>
      </div>
      <p id="emptyMessage" class="help-text hidden">등록된 제품이 없습니다.</p>
    </section>
  </main>
  <script>
    // 제품 관리: 목록에서 선택한 제품을 상단 폼에서 수정하고, 저장 후 서버 목록을 다시 읽습니다.
    let products = [];
    let editingProductId = null;
    let draggedProductRow = null;
    const table = document.getElementById('productTable');
    const productTableHead = document.querySelector('.product-admin-list thead');
    const productFilterFields = ['rank', 'id', 'product_code', 'product_name', 'quantity', 'work_quantity', 'target_quantity', 'status', 'is_enabled'];
    const productFilterLabels = { rank: '순위', id: 'ID', product_code: '제품코드', product_name: '제품명', quantity: '누적 수량', work_quantity: '작업 수량', target_quantity: '목표수량', status: '상태', is_enabled: '사용' };
    const productColumnFilters = new Map();
    let productSortState = null;
    function h(value) { return String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;'); }
    function statusText(status) { return { 생산중: '생산중', 수리중: '수리중', 완료: '완료', 대기: '대기', 정지: '정지' }[status] || status; }
    function message(id, text, type) { const element = document.getElementById(id); element.textContent = text; element.className = `auth-message ${type || ''}`; }

    function productFilterValue(product, field) {
      if (field === 'rank') return String(products.indexOf(product) + 1);
      if (field === 'work_quantity') return String(product.work_quantity ?? product.quantity ?? 0);
      if (field === 'is_enabled') return Number(product.is_enabled) === 1 ? '1' : '0';
      return String(product[field] ?? '');
    }

    function productFilterLabel(product, field) {
      const value = productFilterValue(product, field);
      return field === 'is_enabled' ? value === '1' ? 'Enabled' : 'Disabled' : field === 'status' ? statusText(value) : value;
    }

    function productApplyColumnFilter(rows, field) {
      const selected = productColumnFilters.get(field);
      return selected ? rows.filter(product => selected.has(productFilterValue(product, field))) : rows;
    }

    function filteredProductRows() {
      let rows = [...products];
      for (const field of productFilterFields) rows = productApplyColumnFilter(rows, field);
      if (!productSortState) return rows;
      const { field, direction } = productSortState;
      const numeric = ['rank', 'id', 'quantity', 'work_quantity', 'target_quantity', 'is_enabled'].includes(field);
      const collator = new Intl.Collator('ko', { numeric: true, sensitivity: 'base' });
      return rows.sort((left, right) => {
        const leftValue = productFilterValue(left, field), rightValue = productFilterValue(right, field);
        const comparison = numeric ? Number(leftValue) - Number(rightValue) : collator.compare(leftValue, rightValue);
        return (comparison || Number(left.id) - Number(right.id)) * (direction === 'desc' ? -1 : 1);
      });
    }

    function productOrderEditable() { return productColumnFilters.size === 0 && productSortState === null; }

    function productRenderFilters(startIndex = 0) {
      let availableProducts = products;
      for (const [index, field] of productFilterFields.entries()) {
        if (index < startIndex) { availableProducts = productApplyColumnFilter(availableProducts, field); continue; }
        const container = document.querySelector(`[data-product-filter-container="${field}"]`);
        const values = new Map(availableProducts.map(product => [productFilterValue(product, field), productFilterLabel(product, field)]));
        let selected = productColumnFilters.get(field);
        if (selected) {
          const retained = new Set([...selected].filter(value => values.has(value)));
          if (retained.size !== selected.size) {
            if (selected.size > 0 && retained.size === 0) productColumnFilters.delete(field);
            else productColumnFilters.set(field, retained);
            selected = productColumnFilters.get(field);
          }
        }
        const allSelected = !selected || (values.size > 0 && selected.size === values.size);
        const applied = Boolean(selected && (selected.size !== values.size || selected.size === 0));
        const options = [...values].sort((left, right) => left[1].localeCompare(right[1], 'ko', { numeric: true })).map(([value, label]) => `<label class="product-filter-option" data-filter-label="${h(label.toLowerCase())}"><input type="checkbox" data-product-filter="${field}" value="${h(value)}"${allSelected || selected.has(value) ? ' checked' : ''}><span>${h(label || '-')}</span></label>`).join('');
        const sortButtons = ['asc', 'desc'].map(direction => `<button type="button" data-product-sort="${field}" data-sort-direction="${direction}" aria-pressed="${productSortState?.field === field && productSortState.direction === direction}">${direction === 'asc' ? '오름차순' : '내림차순'}</button>`).join('');
        container.innerHTML = `<button type="button" class="product-filter-trigger${applied ? ' is-filtered' : ''}" data-product-filter-toggle="${field}" aria-label="${productFilterLabels[field]} 값 필터" aria-expanded="false" title="${productFilterLabels[field]} 값 필터"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h14l-5.5 6.3v4.2l-3 1.5v-5.7L3 4Z"/></svg></button><div class="product-filter-menu" hidden><div class="product-filter-sort-actions">${sortButtons}<button type="button" data-product-sort-reset>기본 순서</button></div><input type="search" class="product-filter-search" data-product-filter-search="${field}" placeholder="값 검색" aria-label="필터 값 검색"><label class="product-filter-option"><input type="checkbox" data-product-filter-all="${field}"${allSelected ? ' checked' : ''}><span>모든 값</span></label><div class="product-filter-options">${options}</div></div>`;
        availableProducts = productApplyColumnFilter(availableProducts, field);
      }
    }

    function productCloseFilters() {
      for (const menu of document.querySelectorAll('.product-filter-menu:not([hidden])')) {
        menu.hidden = true;
        menu.parentElement.querySelector('[data-product-filter-toggle]').setAttribute('aria-expanded', 'false');
      }
    }

    function productPositionFilterMenu(trigger, menu) {
      menu.hidden = false;
      trigger.setAttribute('aria-expanded', 'true');
      const bounds = trigger.getBoundingClientRect();
      menu.style.left = `${Math.max(8, Math.min(bounds.left, innerWidth - menu.offsetWidth - 8))}px`;
      menu.style.top = `${Math.max(8, Math.min(bounds.bottom, innerHeight - menu.offsetHeight - 8))}px`;
    }

    function productUpdateFilterTrigger(field, selected, optionCount) {
      const trigger = document.querySelector(`[data-product-filter-toggle="${field}"]`);
      const applied = Boolean(selected && (selected.size !== optionCount || selected.size === 0));
      trigger.classList.toggle('is-filtered', applied);
      trigger.title = applied ? `${productFilterLabels[field]} 필터 적용 중 (${selected.size}/${optionCount})` : `${productFilterLabels[field]} 값 필터`;
      trigger.setAttribute('aria-label', trigger.title);
    }

    async function loadProducts() {
      const res = await fetch('/api/admin/products');
      if (res.status === 401) { location.href = '/user-login.html'; return; }
      if (res.status === 403) { alert('7등급 이상 관리자 권한이 필요합니다.'); location.href = '/'; return; }
      if (!res.ok) { message('addMessage', '제품 목록을 불러오지 못했습니다.', 'error'); return; }
      products = await res.json();
      productCloseFilters();
      productRenderFilters();
      renderProducts();
    }

    function renderProducts() {
      draggedProductRow?.classList.remove('is-dragging');
      draggedProductRow = null;
      const visibleProducts = filteredProductRows();
      const empty = document.getElementById('emptyMessage');
      empty.textContent = products.length ? '필터 조건에 맞는 제품이 없습니다.' : '등록된 제품이 없습니다.';
      empty.classList.toggle('hidden', visibleProducts.length > 0);
      const editableOrder = productOrderEditable();
      table.innerHTML = visibleProducts.map(product => {
        const index = products.indexOf(product);
        const enabled = Number(product.is_enabled) === 1;
        return `<tr class="product-order-row${enabled ? '' : ' is-inactive'}" data-product-id="${product.id}" draggable="${editableOrder}"><td class="product-order-position">${index + 1}</td><td>${product.id}</td><td>${h(product.product_code)}</td><td>${h(product.product_name)}</td><td>${product.quantity}</td><td>${product.work_quantity ?? product.quantity}</td><td>${product.target_quantity}</td><td>${h(statusText(product.status))}</td><td><span class="device-state ${enabled ? 'is-active' : 'is-inactive'}">${enabled ? 'Enabled' : 'Disabled'}</span></td><td class="admin-actions"><button class="output-button ${enabled ? 'admin-danger' : 'admin-submit'} product-enabled-toggle" onclick="toggleProductEnabled(${product.id}, ${!enabled})">${enabled ? 'Disabled' : 'Enabled'}</button><button onclick="editProduct(${product.id})">수정</button><button onclick="deleteProduct(${product.id})">삭제</button></td></tr>`;
      }).join('');
    }

    async function toggleProductEnabled(id, isEnabled) {
      const product = products.find(item => Number(item.id) === Number(id));
      if (!product) return;

      const res = await fetch(`/api/admin/products/${id}/active`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ isEnabled })
      });
      const data = await res.json();
      if (!res.ok) {
        alert(data.error || '제품 사용 상태 변경에 실패했습니다.');
        await loadProducts();
        return;
      }
      await loadProducts();
    }

    async function saveProductOrder() {
      if (!productOrderEditable()) { renderProducts(); return; }
      const rows = Array.from(table.querySelectorAll('tr[data-product-id]'));
      const productIds = rows.map(row => Number(row.dataset.productId));
      if (productIds.length !== products.length || new Set(productIds).size !== products.length) { await loadProducts(); return; }
      const res = await fetch('/api/admin/products/order', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ productIds })
      });
      const data = await res.json();
      if (!res.ok) {
        alert(data.error || '제품 순서를 저장하지 못했습니다.');
        await loadProducts();
        return;
      }

      products = productIds.map(id => products.find(product => Number(product.id) === id)).filter(Boolean);
      rows.forEach((row, index) => {
        row.querySelector('.product-order-position').textContent = String(index + 1);
      });
    }

    table.addEventListener('dragstart', event => {
      const row = event.target.closest('tr[data-product-id]');
      if (!row || !productOrderEditable() || event.target.closest('button, input, label')) {
        event.preventDefault();
        return;
      }
      draggedProductRow = row;
      row.classList.add('is-dragging');
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', row.dataset.productId);
    });

    table.addEventListener('dragover', event => {
      if (!draggedProductRow) return;
      const targetRow = event.target.closest('tr[data-product-id]');
      if (!targetRow || targetRow === draggedProductRow) return;
      event.preventDefault();
      const insertAfter = event.clientY > targetRow.getBoundingClientRect().top + targetRow.offsetHeight / 2;
      table.insertBefore(draggedProductRow, insertAfter ? targetRow.nextElementSibling : targetRow);
    });

    table.addEventListener('drop', async event => {
      if (!draggedProductRow) return;
      event.preventDefault();
      draggedProductRow.classList.remove('is-dragging');
      draggedProductRow = null;
      await saveProductOrder();
    });

    table.addEventListener('dragend', () => {
      draggedProductRow?.classList.remove('is-dragging');
      draggedProductRow = null;
    });

    function editProduct(id) {
      const product = products.find(item => Number(item.id) === Number(id));
      if (!product) return;

      editingProductId = Number(product.id);
      document.getElementById('newCode').value = product.product_code;
      document.getElementById('newCode').disabled = true;
      document.getElementById('newName').value = product.product_name;
      document.getElementById('newQuantity').value = product.quantity;
      document.getElementById('newWorkQuantity').value = product.work_quantity ?? product.quantity;
      document.getElementById('newReason').value = '';
      document.getElementById('newTarget').value = product.target_quantity;
      document.getElementById('newStatus').value = product.status;
      document.getElementById('addFormTitle').textContent = '제품 수정';
      document.getElementById('addFormHelp').textContent = '제품코드는 변경할 수 없습니다. 나머지 정보를 수정한 뒤 저장하세요.';
      document.getElementById('addFormSubmit').textContent = '수정 저장';
      document.getElementById('cancelProductEdit').hidden = false;
      document.getElementById('addForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function resetProductForm() {
      editingProductId = null;
      document.getElementById('addForm').reset();
      document.getElementById('newCode').disabled = false;
      document.getElementById('addFormTitle').textContent = '새로운 제품코드 추가';
      document.getElementById('addFormHelp').textContent = '제품코드, 제품명, 목표수량을 입력하세요.';
      document.getElementById('addFormSubmit').textContent = '제품 추가 등록';
      document.getElementById('cancelProductEdit').hidden = true;
    }

    async function deleteProduct(id) {
      if (!confirm('이 제품을 삭제하시겠습니까? 삭제 후 복구할 수 없습니다.')) return;
      const res = await fetch(`/api/admin/products/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) { alert(data.error || '제품 삭제에 실패했습니다.'); return; }
      if (editingProductId === Number(id)) resetProductForm();
      await loadProducts();
    }

    document.getElementById('addForm').addEventListener('submit', async event => {
      event.preventDefault();
      const isEditing = editingProductId !== null;
      const endpoint = isEditing ? `/api/admin/products/${editingProductId}` : '/api/admin/products';
      const res = await fetch(endpoint, { method: isEditing ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ productCode: newCode.value, productName: newName.value, quantity: newQuantity.value, workQuantity: newWorkQuantity.value, targetQuantity: newTarget.value, reason: newReason.value, status: newStatus.value }) });
      const data = await res.json();
      if (!res.ok) { message('addMessage', data.error || (isEditing ? '제품 수정에 실패했습니다.' : '제품 추가에 실패했습니다.'), 'error'); return; }
      resetProductForm();
      message('addMessage', isEditing ? '제품이 수정되었습니다.' : '제품이 추가되었습니다.', 'success');
      await loadProducts();
    });

    document.getElementById('cancelProductEdit').addEventListener('click', () => {
      resetProductForm();
      message('addMessage', '수정이 취소되었습니다.', '');
    });

    productTableHead.addEventListener('click', event => {
      const reset = event.target.closest('[data-product-sort-reset]');
      const sort = event.target.closest('[data-product-sort]');
      if (reset || sort) {
        productSortState = reset ? null : { field: sort.dataset.productSort, direction: sort.dataset.sortDirection };
        productCloseFilters(); productRenderFilters(); renderProducts(); return;
      }
      const trigger = event.target.closest('[data-product-filter-toggle]');
      if (!trigger) return;
      const menu = trigger.parentElement.querySelector('.product-filter-menu');
      const wasOpen = !menu.hidden;
      productCloseFilters();
      if (!wasOpen) productPositionFilterMenu(trigger, menu);
    });
    productTableHead.addEventListener('change', event => {
      const field = event.target.dataset.productFilter || event.target.dataset.productFilterAll;
      if (!field) return;
      const options = [...document.querySelectorAll(`[data-product-filter="${field}"]`)];
      if (event.target.dataset.productFilterAll) {
        if (event.target.checked) productColumnFilters.delete(field);
        else productColumnFilters.set(field, new Set());
        options.forEach(input => { input.checked = event.target.checked; });
      } else {
        const selected = new Set(options.filter(input => input.checked).map(input => input.value));
        if (selected.size === options.length) productColumnFilters.delete(field);
        else productColumnFilters.set(field, selected);
        event.target.closest('.product-filter-menu').querySelector('[data-product-filter-all]').checked = selected.size === options.length;
      }
      productUpdateFilterTrigger(field, productColumnFilters.get(field), options.length);
      productRenderFilters(productFilterFields.indexOf(field) + 1);
      renderProducts();
    });
    productTableHead.addEventListener('input', event => {
      const field = event.target.dataset.productFilterSearch;
      if (!field) return;
      const search = event.target.value.trim().toLowerCase();
      for (const option of event.target.closest('.product-filter-menu').querySelectorAll('.product-filter-option[data-filter-label]')) option.hidden = !option.dataset.filterLabel.includes(search);
    });
    document.addEventListener('pointerdown', event => { if (!event.target.closest('.product-column-filter')) productCloseFilters(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') productCloseFilters(); });
    window.addEventListener('scroll', productCloseFilters, true);
    window.addEventListener('resize', productCloseFilters);
    async function logout() { await fetch('/api/logout', { method: 'POST' }); location.href = '/user-login.html?logged_out=1'; }
    loadProducts();
  </script>
</body>

</html>
