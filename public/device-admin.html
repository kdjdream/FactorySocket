<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KIMS FACTORIES V1.0</title>
  <link rel="stylesheet" href="/style.css?v=20261005-3">
  <script src="/page-settings.js?v=20261005-4" defer></script>
  <script src="/user-logout.js?v=20260930-1" defer></script>
</head>

<body class="device-page">
  <main class="device-shell">
    <header class="device-header">
      <div class="device-heading">
        <p class="device-eyebrow"></p>
        <h1>장치 관리</h1>
      </div>
      <nav class="device-page-links" aria-label="Device 페이지">
        <a class="link" href="/">생산 현황</a>
        <a class="link" href="/device-control.html">Device 제어</a>
        <a class="link" href="/device-view.html">Device 보기</a>
        <a class="link" href="/device_schedule.html">예약 관리</a>
        <a id="profileLink" class="link" href="/user-profile.html">회원정보</a>
        <button class="logout-button" onclick="logout()">로그아웃</button>

      </nav>
    </header>

    <section class="history-section device-admin-section" aria-labelledby="device-title">
      <div class="section-heading">
        <p class="section-note">장치 ID와 이름을 관리하고, 장치별 접점 채널을 설정합니다.</p>
      </div>

      <div class="device-admin-layout">
        <div class="device-admin-block device-register-block">
          <div class="admin-block-heading"><span class="admin-block-index">01</span>
            <div>
              <h3>장치 추가</h3>
              <p>새 Device를 등록하고 전용 토큰을 발급합니다.</p>
            </div>
          </div>
          <form id="deviceForm" class="device-admin-form">
            <label>장치 ID<input id="newDeviceId" required maxlength="100" pattern="[A-Za-z0-9_-]{2,100}"
                placeholder="예: DEVICE-D1-002" style="padding: 13px 12px; font-size: 16px;"></label>
            <label>장치 이름<input id="newDeviceName" required maxlength="100" placeholder="예: 포장라인 Device"
                style="padding: 13px 12px; font-size: 16px;"></label>
            <p id="deviceMessage" class="device-message" role="alert"></p>
            <button class="output-button admin-submit" type="submit">장치 등록</button>
          </form>
          <div id="tokenResult" class="device-token-result" hidden></div>
        </div>

        <div class="device-admin-block device-list-block">
          <div class="admin-block-heading"><span class="admin-block-index">02</span>
            <div>
              <div class="admin-device-title"><h3>등록 장치</h3><span id="deviceCount" class="admin-device-count">0대</span></div>
              <p>편집 버튼을 누르면 장치와 채널 설정이 펼쳐집니다. 드래그하여 배열 순서를 정하세요.</p>
            </div>
          </div>
          <div class="device-device-table-wrap">
            <table class="device-device-table">
              <thead>
                <tr>
                  <th class="device-id-column">장치 ID</th>
                  <th class="device-name-column">장치 이름</th>
                  <th>상태</th>
                  <th class="device-action-column">관리</th>
                </tr>
              </thead>
              <tbody id="deviceRows"></tbody>
            </table>
          </div>
          <p id="adminMessage" class="device-message" role="status"></p>
        </div>
      </div>
    </section>
  </main>
  <script src="/device-admin.js?v=20260929-2"></script>
</body>

</html>
