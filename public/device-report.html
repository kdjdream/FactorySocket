<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KIMS FACTORIES V1.0</title>
  <link rel="stylesheet" href="/style.css?v=20261015-device-enabled-state">
  <link rel="stylesheet" href="/device-report.css?v=5">
  <script src="/page-settings.js?v=20261005-4" defer></script>
  <script src="/user-logout.js?v=20260930-1" defer></script>
  <script src="/vendor/chart.umd.js" defer></script>
  <script src="/vendor/jspdf.umd.min.js" defer></script>
  <script src="/vendor/html2canvas.min.js" defer></script>
  <script src="/device-report.js?v=17" defer></script>
</head>
<body class="device-page report-page">
  <main class="device-shell">
    <header class="device-header">
      <div class="device-heading"><p class="device-eyebrow"></p><h1>디바이스 리포트</h1></div>
      <nav class="device-page-links" aria-label="Device 페이지">
        <a class="link" href="/">생산 현황</a>
        <a class="link" href="/device-control.html">Device 제어</a>
        <a class="link" href="/device-admin.html">장치 관리</a>
        <a class="link" href="/device_schedule.html">예약 관리</a>
        <a class="link" href="/user-profile.html">회원정보</a>
        <button class="logout-button" onclick="logout()">로그아웃</button>
      </nav>
    </header>
    <section class="report-filters" aria-label="리포트 조회 조건">
      <form id="reportForm">
        <div class="report-filter-grid">
          <label>디바이스<select id="reportDevice" required disabled><option value="">불러오는 중...</option></select></label>
          <label><span>시작 일시 (KST)<span id="reportStartWeekday" aria-live="polite"></span></span><input id="reportStart" type="datetime-local" required></label>
          <label><span>종료 일시 (KST)<span id="reportEndWeekday" aria-live="polite"></span></span><input id="reportEnd" type="datetime-local" required></label>
          <button id="reportSubmit" class="output-button" type="submit" disabled>리포트 조회</button>
        </div>
        <fieldset class="report-channel-fieldset">
          <legend>채널 선택</legend>
          <label class="report-select-all"><input id="reportSelectAll" type="checkbox" disabled> 전체 선택</label>
          <div id="reportChannels" class="report-channel-options"></div>
        </fieldset>
        <fieldset class="report-channel-fieldset">
          <legend>분석 항목 선택</legend>
          <label class="report-select-all"><input id="reportAnalysisAll" type="checkbox" checked> 전체 선택</label>
          <div id="reportAnalysisOptions" class="report-channel-options">
            <label><input type="checkbox" value="onCount" checked> ON 횟수</label>
            <label><input type="checkbox" value="offCount" checked> OFF 횟수</label>
            <label><input type="checkbox" value="transitionCount" checked> 총 전환 횟수</label>
            <label><input type="checkbox" value="onTime" checked> ON 누적시간</label>
            <label><input type="checkbox" value="offTime" checked> OFF 누적 시간</label>
            <label><input type="checkbox" value="onPercentage" checked> ON 시간 비율</label>
            <label><input type="checkbox" value="stateGraph" checked> ON · OFF 상태 그래프</label>
            <label><input type="checkbox" value="onCountGraph" checked> ON 누적 횟수 그래프</label>
            <label><input type="checkbox" value="onTimeGraph" checked> ON 누적 시간 그래프</label>
            <label><input type="checkbox" value="minutelyGraph" checked> 분별 ON 전환 횟수 그래프</label>
            <label><input type="checkbox" value="hourlyGraph" checked> 시간별 ON 전환 횟수 그래프</label>
            <label><input type="checkbox" value="dailyGraph" checked> 일별 ON 전환 횟수 그래프</label>
            <label><input type="checkbox" value="weeklyGraph" checked> 주간별 ON 전환 횟수 그래프</label>
            <label><input type="checkbox" value="monthlyGraph" checked> 월별 ON 전환 횟수 그래프</label>
          </div>
        </fieldset>
      </form>
    </section>
    <section class="report-results" aria-labelledby="reportResultTitle" aria-busy="false">
      <div class="report-result-toolbar">
        <h2 id="reportResultTitle">채널별 분석</h2>
        <div class="report-actions">
          <button id="reportPrintAll" class="link" type="button" disabled>디바이스 PDF 다운로드</button>
          <button id="reportExcel" class="link" type="button" disabled>Excel 다운로드</button>
        </div>
      </div>
      <p id="reportMessage" class="report-message" role="status" aria-live="polite">조회 조건을 선택하세요.</p>
      <p id="reportPeriod" class="report-period"></p>
      <div id="reportResults"></div>
    </section>
  </main>
</body>
</html>
