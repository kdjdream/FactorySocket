<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KIMS FACTORIES V1.0</title>
  <link rel="stylesheet" href="/style.css?v=20261018-schedule-action-menu">
  <script src="/page-settings.js" defer></script><script src="/user-logout.js" defer></script>
  <script src="/device-schedule.js?v=20261024-enabled-selection" defer></script>
</head>
<body class="device-page schedule-page">
<main class="device-shell">
  <header class="device-header">
    <div class="device-heading"><p class="device-eyebrow"></p><h1>예약 관리</h1></div>
    <nav class="device-page-links" aria-label="Device 페이지">
      <a class="link" href="/">생산 현황</a>
      <a class="link" href="/device-view.html">Device 보기</a>
      <a class="link" href="/device-control.html">Device 제어</a>
      <a class="link" href="/device-admin.html">Device 관리</a><a id="profileLink" class="link" href="/user-profile.html">회원정보</a>
      <button class="logout-button" onclick="logout()">로그아웃</button>
    </nav>
  </header>
  <section class="history-section schedule-admin-section">
    <div class="section-heading"><h2 id="scheduleFormTitle">새 예약 등록</h2><p class="section-note">모든 디바이스와 출력 채널의 예약을 통합 관리합니다.</p></div>
    <form id="scheduleForm" class="schedule-admin-form">
      <input type="hidden" name="schedule_id">
      <label>디바이스<select name="device_id" id="scheduleDevice" required><option value="">디바이스 선택</option></select></label>
      <label>출력 채널<select name="output_signal" id="scheduleChannel" required><option value="">채널 선택</option></select></label>
      <label>예약 이름<input name="schedule_name" maxlength="150" placeholder="예: 야간 조명 끄기"></label>
      <label>실행 동작<select name="action_state"><option value="ON">ON</option><option value="OFF">OFF</option></select></label>
      <label>반복 유형<select name="repeat_type" id="repeatType"><option value="IMMEDIATE">즉시 실행</option><option value="ONCE" selected>1회</option><option value="HOURLY">매시간</option><option value="DAILY">매일</option><option value="WEEKLY">반복 요일</option><option value="MONTHLY">매월</option><option value="YEARLY">매년</option></select></label>
      <label data-field="schedule_time">실행 시각<input name="schedule_time" type="datetime-local" required></label>
      <label data-field="end_time" hidden>반복 종료 시각<input name="end_time" type="datetime-local"></label>
      <fieldset class="schedule-weekdays" data-field="weekdays" hidden><legend>반복 요일</legend>
        <label><input type="checkbox" name="weekdays" value="0">일</label><label><input type="checkbox" name="weekdays" value="1">월</label><label><input type="checkbox" name="weekdays" value="2">화</label><label><input type="checkbox" name="weekdays" value="3">수</label><label><input type="checkbox" name="weekdays" value="4">목</label><label><input type="checkbox" name="weekdays" value="5">금</label><label><input type="checkbox" name="weekdays" value="6">토</label>
      </fieldset>
      <label data-field="is_month_end" hidden class="schedule-checkbox"><input name="is_month_end" type="checkbox"> 매월 말일</label>
      <label class="schedule-wide">OStr 전송 문자열<textarea name="ostr_payload" rows="2" maxlength="10000" placeholder="예약 실행 시 장치로 전달할 출력 문자열"></textarea></label>
      <div class="schedule-form-actions schedule-wide"><button type="submit" id="scheduleSubmit" class="output-button admin-submit">예약 등록</button><span id="scheduleValidationMessage" class="schedule-message" role="status" aria-live="polite"></span><button type="button" id="scheduleCancel" class="output-button admin-submit" hidden>수정 취소</button><span id="scheduleMessage" role="status" aria-live="polite"></span></div>
    </form>
  </section>
  <section class="history-section schedule-table-section">
    <div class="section-heading"><h2>전체 예약 현황 <span id="scheduleCount" class="admin-device-count">0건</span></h2><p class="section-note">컬럼별 필터와 정렬을 조합하여 예약을 검색할 수 있습니다.</p></div>
    <div class="schedule-table-wrap" tabindex="0" aria-label="예약 목록 테이블">
      <table class="schedule-table"><thead><tr>
        <th><div class="schedule-column-heading"><span>ID</span><div id="scheduleFilterId" class="schedule-column-filter"></div></div></th>
        <th><div class="schedule-column-heading"><span>예약자</span><div id="scheduleFilterOwner" class="schedule-column-filter"></div></div></th>
        <th><div class="schedule-column-heading"><span>디바이스</span><div id="scheduleFilterDevice" class="schedule-column-filter"></div></div></th>
        <th><div class="schedule-column-heading"><span>채널</span><div id="scheduleFilterChannel" class="schedule-column-filter"></div></div></th>
        <th><div class="schedule-column-heading"><span>예약 이름</span><div id="scheduleFilterName" class="schedule-column-filter"></div></div></th>
        <th><div class="schedule-column-heading"><span>동작</span><div id="scheduleFilterAction" class="schedule-column-filter"></div></div></th>
        <th><div class="schedule-column-heading"><span>OStr 문자열</span><div id="scheduleFilterOstr" class="schedule-column-filter"></div></div></th>
        <th><div class="schedule-column-heading"><span>반복</span><div id="scheduleFilterRepeat" class="schedule-column-filter"></div></div></th>
        <th><div class="schedule-column-heading"><span>다음 실행 시각</span><div id="scheduleFilterNextRun" class="schedule-column-filter"></div></div></th>
        <th><div class="schedule-column-heading"><span>종료 시각</span><div id="scheduleFilterEnd" class="schedule-column-filter"></div></div></th>
        <th><div class="schedule-column-heading"><span>상태</span><div id="scheduleFilterStatus" class="schedule-column-filter"></div></div></th>
        <th><div class="schedule-column-heading"><span>마지막 실행</span><div id="scheduleFilterLastRun" class="schedule-column-filter"></div></div></th>
        <th><div class="schedule-column-heading"><span>등록 시각</span><div id="scheduleFilterCreated" class="schedule-column-filter"></div></div></th>
        <th>관리</th>
      </tr></thead><tbody id="scheduleRows"><tr><td colspan="14">예약 정보를 불러오는 중입니다.</td></tr></tbody></table>
    </div><p class="schedule-table-note">표시 시각은 한국 표준시(KST) 기준입니다. 명령 큐 등록과 실제 출력 상태 변경은 구분하여 기록합니다.</p>
  </section>
  <div id="scheduleActionMenu" class="schedule-action-menu" popover="auto" role="menu" aria-label="예약 관리"></div>
</main>
</body></html>
